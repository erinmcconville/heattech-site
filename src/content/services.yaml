# The four Services sections and their job lines. Source: docs/build-plan.md.
# Each job's "id" is used for the "Ask about this" link (/contact/?job=id)
# and for the enquiry form dropdown. "home: true" shows the job on the homepage.
# "order" sets the order of the four sections.
# "title" is the Services heading, "tile" and "keywords" the homepage tile.
# "review" is the id of a Google review in reviews.yaml shown as proof under the section.

- id: not-working
  order: 1
  icon: flame
  title: Heating or hot water not working
  tile: No heating or hot water
  keywords: Boiler repairs and faults
  review: lena-bruning
  jobs:
    - id: no-heating
      label: No heating or hot water
      home: true
    - id: boiler-fault
      label: Boiler cutting out or showing a fault code
      home: true
    - id: radiators
      label: Radiators cold, noisy or won't switch off
      home: true
    - id: gas-smell
      label: Smell of gas or carbon monoxide alarm
      note: "Call the Gas Emergency number, 0800 111 999, first. [CONFIRM: follow-up once the emergency service has made it safe]"
      emergency: true
      home: true

- id: everyday-plumbing
  order: 2
  icon: droplet
  title: Leaks, taps and drains
  tile: A leak or a blocked drain
  keywords: Plumbing
  review: jenna-mccosh
  jobs:
    - id: plumbing
      label: Leaks, taps, toilets and pipework
      note: "[CONFIRM: scope of everyday plumbing]"
      home: true

- id: replacing-upgrading
  order: 3
  icon: tool
  title: New boilers and upgrades
  tile: A new boiler
  keywords: Replacements, controls and electric to gas
  review: stewart-hunter
  jobs:
    - id: repair-or-replace
      label: "Repair or replace: advice on which makes sense"
      home: true
    - id: new-boiler
      label: New boiler
      home: true
    - id: electric-to-gas
      label: Electric or storage heaters to gas central heating
      page: /electric-to-gas/
      home: true
    - id: controls
      label: Thermostats and smart controls
    - id: hobs-cookers
      label: Gas hobs and cookers
    - id: gas-fires
      label: Gas fires serviced or safely disconnected
  # What every replacement includes, from Ryan's own Facebook posts (research/04). No warranty lengths.
  includes:
    title: Every new boiler includes
    items:
      - System flush
      - Magnetic filter
      - Smart heating controls
      - The manufacturer's warranty (the length depends on the boiler)
    extra_title: What can add cost
    extra:
      - A gas pipe too small for the new boiler
      - A condensate (drain) pipe that needs changing
    check: "[CONFIRM: this is what every replacement includes, and these are the two things that add cost]"

- id: servicing-safety
  order: 4
  icon: clipboard-check
  title: Servicing and gas safety
  tile: Servicing and gas safety
  keywords: Annual service, landlord certificates
  review: r
  section_note: "Servicing keeps most manufacturer warranties valid. [CONFIRM: wording]"
  jobs:
    - id: boiler-service
      label: Annual boiler service
      home: true
    - id: landlord-certificate
      label: Landlord gas safety certificate
      home: true
    - id: sale-check
      label: Gas safety check before selling
      home: true
    - id: several-properties
      label: "Several properties: letting agents and short-let hosts"
      page: /landlords/
