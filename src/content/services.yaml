# One record per service page (docs/superpowers/specs/2026-10-28-site-layout-design.md).
# id:        the page URL (/boiler-repairs/) and the form's job id
# title/line: the homepage row and the page heading; line is one plain line in customers' words
# summary:   the page description for search engines
# includes, price_factors, notes, sources: optional blocks; leave out what doesn't apply
# reviews:   two complete Google reviews from reviews.yaml
# example:   a job in src/content/work/, shown only when published with permission
# jobs:      options in the enquiry form's job list

- id: boiler-repairs
  order: 1
  title: Boiler repairs
  line: No heating, no hot water, fault codes
  icon: flame
  summary: Finding and fixing boiler faults in Edinburgh and the Lothians.
  reviews: [lena-bruning, dawid-granacki]
  jobs:
    - id: boiler-repairs
      label: Boiler repairs
    - id: gas-smell
      label: Smell of gas or carbon monoxide alarm
      emergency: true

- id: new-boilers
  order: 2
  title: New boilers
  line: Replacing an old or broken boiler
  icon: tool
  summary: Replacing old or broken boilers in Edinburgh and the Lothians.
  includes:
    - System flush
    - Magnetic filter
    - Smart controls
    - The manufacturer's warranty
  includes_check: "[CONFIRM: this is what every replacement includes]"
  price_title: What can change the price
  price_factors:
    - label: The gas pipe
      text: Older pipes can be too small for a new boiler.
    - label: The drain pipe
      text: It sometimes needs changing to suit the new boiler.
  price_check: "[CONFIRM: these are the two things that add cost]"
  reviews: [matt-inglis, stewart-hunter]
  example: boiler-replacement-flat
  jobs:
    - id: new-boilers
      label: New boilers

- id: heating-upgrades
  order: 3
  title: Heating upgrades
  line: Electric to gas, smart controls, radiators
  icon: trending-up
  summary: Electric to gas central heating, smart controls and extra radiators in Edinburgh and the Lothians.
  price_title: What decides whether electric to gas can be done
  price_factors:
    - label: A gas supply
      text: SGN checks for free whether the building has one. Flats on the second floor or above can need a separate connection quote.
    - label: The flue
      text: Where it can leave the building. Listed buildings and conservation areas have extra rules.
    - label: Pipe routes
      text: Through the roof space or under the floors.
    - label: Where the boiler goes
      text: A cupboard, the hall or the kitchen.
  notes:
    - Home Energy Scotland's standard grant and loan doesn't cover gas boilers. Warmer Homes Scotland can help some households with central heating.
  sources:
    - text: SGN gas supply check
      href: https://www.sgn.co.uk/gas-connections/household-customers/find-out-if-you-have-gas-supply
    - text: SGN new connections
      href: https://www.sgn.co.uk/gas-connections/household-customers/apply-new-gas-connection0
    - text: City of Edinburgh Council on listed buildings
      href: https://www.edinburgh.gov.uk/conservation-2/listed-buildings
    - text: Home Energy Scotland funding
      href: https://www.homeenergyscotland.org/find-funding
    - text: Warmer Homes Scotland
      href: https://www.mygov.scot/energy-saving-funding/warmer-homes-scotland-scheme
  last_checked: 27 October 2026
  reviews: [stephen-wotherspoon, kyrsta-macdonald-scott]
  example: stockbridge-gas-central-heating
  jobs:
    - id: heating-upgrades
      label: Heating upgrades

- id: servicing-and-certificates
  order: 4
  title: Servicing and certificates
  line: Annual service, landlord and pre-sale checks
  icon: clipboard-check
  summary: Annual boiler services and gas safety certificates for homeowners, landlords and sellers in Edinburgh and the Lothians.
  includes:
    - Annual boiler service
    - Landlord gas safety certificate
    - Gas safety check before selling
    - Several properties and letting agents
  notes:
    - "Servicing keeps most manufacturer warranties valid. [CONFIRM: wording]"
    - "[CONFIRM: how certificates are sent, and whether you send reminders when they're due]"
  sources:
    - text: HSE on landlord gas safety checks
      href: https://www.hse.gov.uk/gas/landlords/safetycheckswhocan.htm
  last_checked: 27 October 2026
  reviews: [r, gregor-fortune]
  jobs:
    - id: servicing-and-certificates
      label: Servicing and certificates

